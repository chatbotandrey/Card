<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мої проєкти — chatbot.dev_andrey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&family=Onest:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #0d0d0d;
    font-family: 'Onest', sans-serif;
    padding: 20px;
    overflow-x: hidden;
  }

  .page {
    max-width: 360px;
    margin: 0 auto;
    animation: fadeUp 0.6s ease both;
  }

  /* Планшети */
  @media (min-width: 600px) and (max-width: 899px) {
    .page {
      max-width: 600px;
    }
  }

  /* Десктоп — одна широкая карточка в ряд */
  @media (min-width: 900px) {
    .page {
      max-width: 800px;
    }
  }

  /* Широкие экраны */
  @media (min-width: 1200px) {
    .page {
      max-width: 900px;
    }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .header {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    border-radius: 24px;
    padding: 28px;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }

  .header::before {
    content: '';
    position: absolute;
    top: -60px; right: -60px;
    width: 200px; height: 200px;
    background: radial-gradient(circle, rgba(94,114,228,0.25) 0%, transparent 70%);
    border-radius: 50%;
  }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: rgba(255,255,255,0.5);
    font-size: 13px;
    text-decoration: none;
    margin-bottom: 16px;
    transition: color 0.2s;
    position: relative;
    z-index: 1;
  }

  .back-btn:hover { color: #fff; }

  .page-title {
    font-family: 'Unbounded', sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: #fff;
    position: relative;
    z-index: 1;
  }

  .page-sub {
    font-size: 13px;
    color: rgba(255,255,255,0.4);
    margin-top: 6px;
    position: relative;
    z-index: 1;
  }

  /* PROJECT CARD */
  .project-card {
    background: #111;
    border: 1px solid #222;
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 16px;
    transition: border-color 0.2s;
  }

  .project-card:hover { border-color: #333; }

  /* Обложка — показываем картинку ПОЛНОСТЬЮ, без обрезки */
  .project-cover {
    width: 100%;
    height: auto;
    display: block;
    background: linear-gradient(135deg, #1a1a2e, #0f3460);
  }

  .project-body { padding: 16px 20px; }

  .project-title-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }

  .project-title {
    font-family: 'Unbounded', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: #fff;
  }

  .demo-badge {
    display: inline-flex;
    align-items: center;
    font-family: 'Onest', sans-serif;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #f5a623;
    background: rgba(245,166,35,0.12);
    border: 1px solid rgba(245,166,35,0.35);
    border-radius: 6px;
    padding: 3px 8px;
    white-space: nowrap;
  }

  .project-desc {
    font-size: 12px;
    color: rgba(255,255,255,0.5);
    line-height: 1.6;
    white-space: pre-line;
    margin-bottom: 14px;
  }

  .project-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: 1px solid #2a2a2a;
    border-radius: 8px;
    padding: 8px 12px;
    color: rgba(255,255,255,0.5);
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s;
    width: 100%;
    justify-content: center;
  }

  .project-toggle:hover {
    border-color: #5e72e4;
    color: #8b9cf7;
  }

  .project-toggle.open {
    border-color: #5e72e4;
    color: #8b9cf7;
  }

  .project-toggle .arr {
    transition: transform 0.3s;
  }

  .project-toggle.open .arr { transform: rotate(180deg); }

  /* MEDIA GALLERY */
  .media-section {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.5s ease;
  }

  .media-section.open { max-height: 200000px; }

  .media-inner { padding: 0 20px 16px; }

  .media-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 8px;
    align-items: start;
  }

  .media-grid img {
    width: 100%;
    min-width: 0;
    height: auto;
    display: block;
    border-radius: 10px;
    cursor: pointer;
    transition: transform 0.2s;
    background: #1a1a1a;
  }

  .media-grid img:hover { transform: scale(1.02); }

  .full-desc {
    font-size: 12px;
    color: rgba(255,255,255,0.6);
    line-height: 1.7;
    white-space: pre-line;
    background: rgba(94,114,228,0.06);
    border: 1px solid rgba(94,114,228,0.15);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 12px;
  }

  .video-thumb {
    background: linear-gradient(135deg, #1a1a2e, #0f3460);
    border-radius: 12px;
    padding: 24px;
    text-align: center;
    cursor: pointer;
    margin-bottom: 8px;
    transition: opacity 0.2s;
    border: 1px solid rgba(94,114,228,0.2);
  }

  .video-thumb:hover { opacity: 0.85; }

  .video-play-icon {
    font-size: 40px;
    margin-bottom: 8px;
  }

  .video-label {
    font-size: 12px;
    color: rgba(255,255,255,0.5);
  }

  .video-wrap {
    border-radius: 12px;
    overflow: hidden;
    margin-top: 8px;
    background: #000;
  }

  .video-wrap iframe {
    width: 100%;
    aspect-ratio: 9/16;
    border: none;
    display: block;
  }

  .video-wrap video {
    width: 100%;
    border-radius: 12px;
    display: block;
  }

  /* LIGHTBOX */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.95);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    user-select: none;
  }

  .lightbox.show { display: flex; }

  .lightbox-content {
    max-width: 98vw;
    max-height: 98vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .lightbox-content img {
    max-width: 98vw;
    max-height: 98vh;
    border-radius: 8px;
    object-fit: contain;
  }

  .lightbox-content iframe {
    width: 85vw;
    aspect-ratio: 9/16;
    border-radius: 12px;
    border: none;
    max-height: 90vh;
  }

  .lightbox-close {
    position: absolute;
    top: 20px; right: 20px;
    background: rgba(255,255,255,0.1);
    border: none;
    border-radius: 50%;
    width: 36px; height: 36px;
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }

  .lightbox-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255,255,255,0.1);
    border: none;
    border-radius: 50%;
    width: 44px; height: 44px;
    color: #fff;
    font-size: 28px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
    z-index: 1;
  }

  .lightbox-nav:hover { background: rgba(255,255,255,0.2); }
  .lightbox-nav.prev { left: 12px; }
  .lightbox-nav.next { right: 12px; }

  .lightbox-counter {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.5);
    font-size: 12px;
  }

  .loading {
    text-align: center;
    padding: 40px;
    color: rgba(255,255,255,0.3);
    font-size: 14px;
  }

  .footer {
    text-align: center;
    font-size: 11px;
    color: rgba(255,255,255,0.1);
    padding: 16px 0 8px;
  }
</style>
</head>
<body>

<div class="page">
  <div class="header">
    <a href="index.html" class="back-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      Назад до візитки
    </a>
    <div class="page-title">Мої проєкти</div>
    <div class="page-sub">Реалізовані кейси та автоматизації</div>
  </div>

  <div id="projectsList">
    <div class="loading">Завантаження...</div>
  </div>

  <div class="footer">© 2026 chatbot.dev_andrey</div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <button class="lightbox-nav prev" onclick="changeMedia(-1)">&#8249;</button>
  <div class="lightbox-content" id="lightboxContent"></div>
  <button class="lightbox-nav next" onclick="changeMedia(1)">&#8250;</button>
  <div class="lightbox-counter" id="lightboxCounter"></div>
</div>

<script>
const BASE = 'https://chatbotandrey.github.io/Card/';

function getYouTubeId(url) {
  const match = url.match(/(?:shorts\/|v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  return match ? match[1] : null;
}

function renderVideo(videoSrc, folder) {
  if (!videoSrc) return '';
  const ytId = getYouTubeId(videoSrc);
  if (ytId) {
    return `<div class="video-wrap">
      <iframe src="https://www.youtube.com/embed/${ytId}" allowfullscreen></iframe>
    </div>`;
  }
  if (videoSrc.includes('vimeo.com')) {
    const vimeoMatch = videoSrc.match(/vimeo\.com\/(?:video\/)?(\d+)/);
    if (vimeoMatch) {
      return `<div class="video-wrap">
        <iframe src="https://player.vimeo.com/video/${vimeoMatch[1]}" allowfullscreen></iframe>
      </div>`;
    }
  }
  if (videoSrc.startsWith('http')) {
    return `<div class="video-wrap">
      <iframe src="${videoSrc}" allowfullscreen></iframe>
    </div>`;
  }
  return `<div class="video-wrap">
    <video controls src="${BASE}${folder}/${videoSrc}"></video>
  </div>`;
}

function renderProject(p, index) {
  const folder = p.folder;
  const count = p.index ? p.index.count : 0;
  const cover = p.index ? p.index.cover : '1.png';
  const video = p.index ? p.index.video : null;

  let mediaGridHTML = '';
  const allMedia = [];
  if (video) allMedia.push({ type: 'video', src: video, folder });
  for (let i = 1; i <= count; i++) {
    const fname = `${i}.png`;
    allMedia.push({ type: 'photo', src: `${BASE}${folder}/${fname}` });
  }
  const mediaKey = `media_${folder.replace(/\//g, '_')}`;
  window[mediaKey] = allMedia;
  const photoStartIndex = video ? 1 : 0;
  for (let i = photoStartIndex; i < allMedia.length; i++) {
    mediaGridHTML += `<img src="${allMedia[i].src}" alt="скрін ${i}" onclick="openMediaLightbox('${mediaKey}', ${i})" loading="lazy">`;
  }

  return `
  <div class="project-card">
    <img class="project-cover" src="${BASE}${folder}/${cover}" alt="${p.title}">
    <div class="project-body">
      <div class="project-title-row">
        <div class="project-title">${p.title}</div>
        ${p.demo ? '<span class="demo-badge">Демо</span>' : ''}
      </div>
      <div class="project-desc">${p.description}</div>
      <button class="project-toggle" onclick="toggleMedia(this)">
        <svg class="arr" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>
        <span class="btn-label">Детальніше</span>
      </button>
    </div>
    <div class="media-section">
      <div class="media-inner">
        ${p.full_description ? `<div class="full-desc">${p.full_description}</div>` : ''}
        ${video ? `<div class="video-thumb" onclick="openMediaLightbox('${mediaKey}', 0)">
          <div class="video-play-icon">▶</div>
          <div class="video-label">Натисніть для перегляду відео</div>
        </div>` : ''}
        <div class="media-grid">${mediaGridHTML}</div>
      </div>
    </div>
  </div>`;
}

function toggleMedia(btn) {
  const card = btn.closest('.project-card');
  const section = card.querySelector('.media-section');
  const isOpen = btn.classList.contains('open');

  // close all
  document.querySelectorAll('.project-card').forEach(c => {
    const b = c.querySelector('.project-toggle');
    const s = c.querySelector('.media-section');
    if (b) { b.classList.remove('open'); b.querySelector('.btn-label').textContent = 'Детальніше'; }
    if (s) s.classList.remove('open');
  });

  // open clicked if was closed
  if (!isOpen) {
    btn.classList.add('open');
    section.classList.add('open');
    btn.querySelector('.btn-label').textContent = 'Сховати ↑';
    setTimeout(() => {
      const top = card.getBoundingClientRect().top + window.pageYOffset - 16;
      window.scrollTo({ top, behavior: 'smooth' });
    }, 400);
  }
}

let currentMedia = [];
let currentMediaIndex = 0;
let touchStartX = 0;

function getEmbedUrl(src) {
  const ytId = src.match(/(?:shorts\/|v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  if (ytId) return `https://www.youtube.com/embed/${ytId[1]}?autoplay=1`;
  const vimeoMatch = src.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  if (vimeoMatch) return `https://player.vimeo.com/video/${vimeoMatch[1]}?autoplay=1`;
  return src;
}

function openMediaLightbox(mediaKey, index) {
  currentMedia = window[mediaKey] || [];
  currentMediaIndex = index || 0;
  updateMediaLightbox();
  document.getElementById('lightbox').classList.add('show');

  const lb = document.getElementById('lightbox');
  lb.ontouchstart = e => { touchStartX = e.touches[0].clientX; };
  lb.ontouchend = e => {
    const diff = touchStartX - e.changedTouches[0].clientX;
    if (Math.abs(diff) > 50) changeMedia(diff > 0 ? 1 : -1);
  };
  lb.onclick = e => { if (e.target === lb) closeLightbox(); };
}

function updateMediaLightbox() {
  const item = currentMedia[currentMediaIndex];
  const content = document.getElementById('lightboxContent');
  if (item.type === 'photo') {
    content.innerHTML = `<img src="${item.src}" alt="">`;
  } else {
    content.innerHTML = `<iframe src="${getEmbedUrl(item.src)}" allowfullscreen allow="autoplay"></iframe>`;
  }
  document.getElementById('lightboxCounter').textContent = `${currentMediaIndex + 1} / ${currentMedia.length}`;
}

function changeMedia(dir) {
  // stop video before switching
  document.getElementById('lightboxContent').innerHTML = '';
  currentMediaIndex = (currentMediaIndex + dir + currentMedia.length) % currentMedia.length;
  updateMediaLightbox();
}

function closeLightbox() {
  document.getElementById('lightboxContent').innerHTML = '';
  document.getElementById('lightbox').classList.remove('show');
}

async function loadProjects() {
  try {
    const res = await fetch(`${BASE}projects.json?t=${Date.now()}`);
    const projects = await res.json();

    await Promise.all(projects.map(async p => {
      try {
        const r = await fetch(`${BASE}${p.folder}/index.json?t=${Date.now()}`);
        p.index = await r.json();
      } catch { p.index = { count: 0, cover: '1.png' }; }
    }));

    document.getElementById('projectsList').innerHTML = projects.map(renderProject).join('');
  } catch(e) {
    document.getElementById('projectsList').innerHTML = '<div class="loading">Помилка завантаження 😢</div>';
  }
}

loadProjects();
</script>
</body>
</html>
