<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Відгуки — chatbot.dev_andrey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&family=Onest:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #0d0d0d;
    font-family: 'Onest', sans-serif;
    padding: 20px;
    overflow-x: hidden;
  }

 .empty {
    text-align: center;
    padding: 40px 20px;
    color: rgba(255,255,255,0.3);
    font-size: 14px;
    grid-column: 1 / -1;
  }
 
  .page {
    max-width: 360px;
    margin: 0 auto;
    animation: fadeUp 0.6s ease both;
  }

  /* Планшети та ландшафтна орієнтація телефону */
  @media (min-width: 600px) and (max-width: 767px) {
    .page {
      max-width: 600px;
    }
  }

  /* Десктоп — як на головній сторінці та в проєктах */
  @media (min-width: 768px) {
    .page {
      max-width: 900px;
    }

    #reviewsList {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      align-items: start;
    }

    .review-card {
      margin-bottom: 0;
    }
  }

  /* Широкі екрани */
  @media (min-width: 1200px) {
    .page {
      max-width: 1000px;
    }

    #reviewsList {
      grid-template-columns: 1fr 1fr 1fr;
    }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .header {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    border-radius: 24px;
    padding: 28px;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }

  .header::before {
    content: '';
    position: absolute;
    top: -60px; right: -60px;
    width: 200px; height: 200px;
    background: radial-gradient(circle, rgba(94,114,228,0.25) 0%, transparent 70%);
    border-radius: 50%;
  }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: rgba(255,255,255,0.5);
    font-size: 13px;
    text-decoration: none;
    margin-bottom: 16px;
    transition: color 0.2s;
    position: relative;
    z-index: 1;
  }

  .back-btn:hover { color: #fff; }

  .page-title {
    font-family: 'Unbounded', sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: #fff;
    position: relative;
    z-index: 1;
  }

  .page-sub {
    font-size: 13px;
    color: rgba(255,255,255,0.4);
    margin-top: 6px;
    position: relative;
    z-index: 1;
  }

  /* STATS */
  .stats {
    background: #111;
    border: 1px solid #222;
    border-radius: 16px;
    padding: 16px 20px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .stats-rating {
    font-family: 'Unbounded', sans-serif;
    font-size: 36px;
    font-weight: 700;
    color: #fff;
    line-height: 1;
  }

  .stats-right { flex: 1; }

  .stats-stars { color: #f5c518; font-size: 16px; margin-bottom: 4px; }

  .stats-count {
    font-size: 12px;
    color: rgba(255,255,255,0.4);
  }

  /* REVIEW CARD */
  .review-card {
    background: #111;
    border: 1px solid #222;
    border-radius: 16px;
    padding: 16px 20px;
    margin-bottom: 12px;
    transition: border-color 0.2s;
  }

  .review-card:hover { border-color: #333; }

  .review-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .review-author {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .review-avatar {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: linear-gradient(135deg, #5e72e4, #34d399);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    flex-shrink: 0;
  }

  .review-name {
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    line-height: 1.2;
  }

  .review-role {
    font-size: 11px;
    color: rgba(255,255,255,0.4);
    margin-top: 2px;
  }

  .review-stars { color: #f5c518; font-size: 13px; }

  .review-text {
    font-size: 13px;
    color: rgba(255,255,255,0.65);
    line-height: 1.6;
    margin-bottom: 8px;
  }

  .review-date {
    font-size: 11px;
    color: rgba(255,255,255,0.25);
  }

  .empty {
    text-align: center;
    padding: 40px 20px;
    color: rgba(255,255,255,0.3);
    font-size: 14px;
  }

  .footer {
    text-align: center;
    font-size: 11px;
    color: rgba(255,255,255,0.1);
    padding: 16px 0 8px;
  }

  .loading {
    text-align: center;
    padding: 40px;
    color: rgba(255,255,255,0.3);
    font-size: 14px;
  }
</style>
</head>
<body>

<div class="page">
  <div class="header">
    <a href="index.html" class="back-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      Назад до візитки
    </a>
    <div class="page-title">Відгуки</div>
    <div class="page-sub">Що кажуть клієнти</div>
  </div>

  <div id="statsBlock"></div>
  <div id="reviewsList"><div class="loading">Завантаження...</div></div>

  <div class="footer">© 2026 chatbot.dev_andrey</div>
</div>

<script>
const BASE = 'https://miniapp-backend.andrchatbot.workers.dev';

function getInitials(name) {
  return name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
}

function renderStars(rating) {
  return '★'.repeat(rating) + '☆'.repeat(5 - rating);
}

function renderStats(reviews) {
  if (!reviews.length) return '';
  const avg = (reviews.reduce((s, r) => s + r.rating, 0) / reviews.length).toFixed(1);
  return `
  <div class="stats">
    <div class="stats-rating">${avg}</div>
    <div class="stats-right">
      <div class="stats-stars">${renderStars(Math.round(avg))}</div>
      <div class="stats-count">${reviews.length} відгук${reviews.length === 1 ? '' : reviews.length < 5 ? 'и' : 'ів'}</div>
    </div>
  </div>`;
}

function renderReview(r) {
  return `
  <div class="review-card">
    <div class="review-header">
      <div class="review-author">
        <div class="review-avatar">${getInitials(r.name)}</div>
        <div>
          <div class="review-name">${r.name}</div>
          ${r.role ? `<div class="review-role">${r.role}</div>` : ''}
        </div>
      </div>
      <div class="review-stars">${renderStars(r.rating)}</div>
    </div>
    <div class="review-text">${r.text}</div>
    <div class="review-date">${r.date}</div>
  </div>`;
}

async function loadReviews() {
  try {
    const res = await fetch(`${BASE}/reviews`);
    const reviews = await res.json();
    document.getElementById('statsBlock').innerHTML = renderStats(reviews);
    document.getElementById('reviewsList').innerHTML = reviews.length
      ? reviews.map(renderReview).join('')
      : '<div class="empty">Поки що відгуків немає 😊</div>';
  } catch(e) {
    document.getElementById('reviewsList').innerHTML = '<div class="empty">Поки що відгуків немає 😊</div>';
    document.getElementById('statsBlock').innerHTML = '';
  }
}

loadReviews();
</script>
</body>
</html>
