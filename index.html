<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Визитка</title>
<link href="https://googleapis.com" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #0d0d0d;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Onest', sans-serif;
    padding: 20px;
    overflow-y: auto;
  }

  .card {
    width: 360px;
    background: #111;
    border-radius: 24px;
    overflow: hidden;
    border: 1px solid #222;
    box-shadow: 0 0 60px rgba(0,0,0,0.6);
    animation: fadeUp 0.6s ease both;
    margin-bottom: 20px;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .header {
    position: relative;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    padding: 36px 28px 28px;
    overflow: hidden;
  }

  .header::before {
    content: '';
    position: absolute;
    top: -60px; right: -60px;
    width: 200px; height: 200px;
    background: radial-gradient(circle, rgba(94,114,228,0.25) 0%, transparent 70%);
    border-radius: 50%;
  }

  .header::after {
    content: '';
    position: absolute;
    bottom: -40px; left: -40px;
    width: 160px; height: 160px;
    background: radial-gradient(circle, rgba(52,211,153,0.12) 0%, transparent 70%);
    border-radius: 50%;
  }

  /* Контейнер для аватарки и статуса */
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 16px;
    position: relative;
    z-index: 1;
  }

  .avatar {
    width: 72px; height: 72px;
    border-radius: 50%;
    background: linear-gradient(135deg, #5e72e4, #34d399);
    box-shadow: 0 8px 24px rgba(94,114,228,0.4);
  }

  /* Перенесенный статус «на зв'язку» напротив фото */
  .dot-status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: rgba(255,255,255,0.4);
    background: rgba(0, 0, 0, 0.3);
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.05);
  }

  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #34d399;
    box-shadow: 0 0 6px #34d399;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .name {
    font-family: 'Unbounded', sans-serif;
    font-size: 17px;
    font-weight: 600;
    color: #fff;
    line-height: 1.2;
    position: relative; z-index: 1;
    margin-bottom: 6px;
  }

  .role {
    font-size: 13px;
    color: rgba(255,255,255,0.55);
    font-weight: 300;
    position: relative; z-index: 1;
    letter-spacing: 0.01em;
    line-height: 1.5;
  }

  .body { padding: 24px 28px; }

  .section-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: rgba(255,255,255,0.25);
    font-weight: 500;
    margin-bottom: 12px;
  }

  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 24px;
  }

  .tag {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 10px;
    padding: 7px 13px;
    font-size: 12px;
    color: rgba(255,255,255,0.7);
    font-weight: 400;
    transition: all 0.2s;
    cursor: default;
  }

  .tag:hover {
    border-color: #5e72e4;
    color: #8b9cf7;
    background: rgba(94,114,228,0.08);
  }

  .contacts { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }

  .contact-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 12px 14px;
    border-radius: 12px;
    color: #fff;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    transition: opacity 0.2s, transform 0.1s;
    border: none;
  }

  .contact-btn:hover { opacity: 0.9; transform: translateY(-1px); }
  .contact-btn:active { transform: scale(0.98); }

  .btn-tg { background: #24A1DE; }
  .btn-inst { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
  .btn-fb { background: #1877F2; }
  .btn-threads { background: #000000; border: 1px solid #2a2a2a; }

  .btn-icon { width: 18px; height: 18px; fill: currentColor; }

  /* НОВАЯ КНОПКА ЗАПИСИ КОНТАКТА В ОТДЕЛЬНОМ БЛОКЕ */
  .add-contact-block {
    margin-bottom: 24px;
  }

  .add-contact-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    background: linear-gradient(135deg, #5e72e4, #34d399);
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
    box-shadow: 0 4px 15px rgba(94,114,228,0.2);
    transition: all 0.2s;
  }

  .add-contact-btn:hover {
    opacity: 0.95;
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(94,114,228,0.3);
  }

  /* FORM STYLES */
  .form select, .form input, .form textarea {
    width: 100%;
    margin-top: 10px;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid #2a2a2a;
    background: #161616;
    color: #fff;
    font-family: inherit;
    font-size: 13px;
  }

  .form select { cursor: pointer; outline: none; }
  .form textarea { min-height: 80px; resize: vertical; }

  .form button {
    width: 100%;
    margin-top: 12px;
    padding: 12px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #5e72e4, #34d399);
    color: #fff;
    cursor: pointer;
    font-weight: 600;
    font-family: inherit;
    font-size: 14px;
    transition: all 0.2s;
  }

  .form button:hover { opacity: 0.9; transform: translateY(-1px); }

  /* Упрощенный аккуратный копирайт внизу */
  .footer {
    padding: 16px 28px;
    border-top: 1px solid #1a1a1a;
    text-align: center;
    font-size: 11px;
    color: rgba(255,255,255,0.15);
    letter-spacing: 0.05em;
  }
</style>
</head>
