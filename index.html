<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Візитка — chatbot.dev_andrey</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&family=Onest:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  background:#0d0d0d;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'Onest',sans-serif;
  padding:20px;
  overflow-y:auto;
}

.card{
  width:360px;
  background:#111;
  border-radius:24px;
  overflow:hidden;
  border:1px solid #222;
  box-shadow:0 0 60px rgba(0,0,0,.6);
}

.header{
  position:relative;
  background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);
  padding:36px 28px 28px;
}

.header-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  margin-bottom:16px;
}

.avatar{
  width:72px;
  height:72px;
  border-radius:50%;
  object-fit:cover;
  background:linear-gradient(135deg,#5e72e4,#34d399);
  box-shadow:0 8px 24px rgba(94,114,228,.4);
}

.dot-status{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:12px;
  color:rgba(255,255,255,.4);
  background:rgba(0,0,0,.3);
  padding:6px 12px;
  border-radius:20px;
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#34d399;
  box-shadow:0 0 6px #34d399;
}

.name{
  font-family:'Unbounded',sans-serif;
  font-size:17px;
  font-weight:600;
  color:#fff;
  margin-bottom:6px;
}

.role{
  font-size:13px;
  color:rgba(255,255,255,.55);
  line-height:1.5;
}

.body{
  padding:24px 28px;
}

.section-title{
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.12em;
  color:rgba(255,255,255,.25);
  margin-bottom:12px;
}

.tags{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:24px;
}

.tag{
  background:#1a1a1a;
  border:1px solid #2a2a2a;
  border-radius:10px;
  padding:7px 13px;
  font-size:12px;
  color:rgba(255,255,255,.7);
}

.contacts{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-bottom:24px;
}

/* ===== НОВАЯ КНОПКА ===== */

.socials-toggle{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  padding:15px 18px;
  border-radius:16px;
  border:1px solid #2d2d2d;
  background:linear-gradient(135deg,#1d1d1d,#151515);
  color:#fff;
  font-size:14px;
  font-weight:600;
  font-family:inherit;
  cursor:pointer;
  overflow:hidden;
  transition:all .25s ease;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.04),
    0 6px 20px rgba(0,0,0,.35);
}

.socials-toggle::before{
  content:'';
  position:absolute;
  inset:0;

  background:linear-gradient(
    135deg,
    rgba(94,114,228,.16),
    rgba(52,211,153,.10)
  );

  opacity:0;
  transition:opacity .25s ease;
}

.socials-toggle:hover::before{
  opacity:1;
}

.socials-toggle:hover{
  transform:translateY(-1px);
  border-color:#3a3a3a;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.05),
    0 10px 28px rgba(0,0,0,.45);
}

.toggle-left{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  position:relative;
  z-index:1;
  text-align:center;
}

.toggle-arrow{
  position:absolute;
  right:16px;
  opacity:.5;
  transition:transform .3s ease,opacity .3s ease;
}

.socials-toggle.open .toggle-arrow{
  transform:rotate(180deg);
  opacity:1;
}

/* ========================= */

.socials-dropdown{
  display:flex;
  flex-direction:column;
  gap:8px;
  max-height:0;
  overflow:hidden;
  transition:max-height .4s ease,opacity .3s ease,margin-top .3s ease;
  opacity:0;
  margin-top:0;
}

.socials-dropdown.open{
  max-height:300px;
  opacity:1;
  margin-top:8px;
}

.contact-btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding:12px 14px;
  border-radius:12px;
  color:#fff;
  text-decoration:none;
  font-size:14px;
  font-weight:600;
}

.btn-tg{
  background:#24A1DE;
}

.btn-inst{
  background:linear-gradient(45deg,#f09433 0%,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888 100%);
}

.btn-fb{
  background:#1877F2;
}

.btn-threads{
  background:#000;
  border:1px solid #333;
}

.btn-icon{
  width:18px;
  height:18px;
  fill:currentColor;
}

</style>
</head>

<body>

<div class="card">

<div class="header">

<div class="header-top">

<img
src="https://raw.githubusercontent.com/chatbotandrey/Card/main/photo_2026-05-29_08-20-55.png"
class="avatar"
alt="Андрій"
>

<div class="dot-status">
<div class="dot"></div>
на зв'язку
</div>

</div>

<div class="name">chatbot.dev_andrey</div>

<div class="role">
Роблю чат-боти для Telegram та Instagram<br>
Автоматизую продажі, оплати та комунікацію
</div>

</div>

<div class="body">

<div class="section-title">Послуги</div>

<div class="tags">
<div class="tag">🤖 Чат-боти TG</div>
<div class="tag">📸 Боти Instagram</div>
<div class="tag">⚙️ Автоворонки</div>
<div class="tag">💳 Автооплати</div>
<div class="tag">📚 Курси</div>
<div class="tag">🔒 Закриті клуби</div>
<div class="tag">🎯 Лідогенерація</div>
</div>

<div class="section-title">Соцмережі</div>

<div class="contacts">

<!-- НОВАЯ КНОПКА -->

<button class="socials-toggle" id="socialsToggle" onclick="toggleSocials()">

<div class="toggle-left">

<svg width="18" height="18" viewBox="0 0 24 24" fill="rgba(255,255,255,0.75)">
<path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
</svg>

<span>Мої соцмережі</span>

</div>

<svg class="toggle-arrow" width="18" height="18" viewBox="0 0 24 24" fill="white">
<path d="M7 10l5 5 5-5z"/>
</svg>

</button>

<!-- Dropdown -->

<div class="socials-dropdown" id="socialsDropdown">

<a href="https://t.me/chatbot_dev_andrey" target="_blank" class="contact-btn btn-tg">
Telegram
</a>

<a href="https://instagram.com/chatbot.dev_andrey" target="_blank" class="contact-btn btn-inst">
Instagram
</a>

<a href="https://www.facebook.com/profile.php?id=61585979653533" target="_blank" class="contact-btn btn-fb">
Facebook
</a>

<a href="https://www.threads.net/@chatbot.dev_andrey" target="_blank" class="contact-btn btn-threads">
Threads
</a>

</div>

</div>

</div>

</div>

<script>

function toggleSocials(){
  const btn=document.getElementById('socialsToggle');
  const dropdown=document.getElementById('socialsDropdown');

  btn.classList.toggle('open');
  dropdown.classList.toggle('open');
}

</script>

</body>
</html>
